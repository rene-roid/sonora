appId: dev.sonora.app
productName: Sonora
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - resources/**
  - package.json
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.png
  artifactName: ${productName}-${version}-setup.${ext}
linux:
  maintainer: rene-roid <rene-roid@users.noreply.github.com>
  target:
    - AppImage
    - deb
  category: AudioVideo
  icon: resources/icon.png
  artifactName: ${productName}-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
publish: null
